nowo_word_to_pdf:
    engine: libreoffice
    default_profile: default
    profiles:
        default:
            # Shared Nowo Process limit (PROCESS_TIMEOUT). Keep below PHP max_execution_time (240)
            # and Caddy write timeout (250s) — see docs/DEMO-FRANKENPHP.md (REQ-RUNTIME-001).
            timeout: '%env(int:PROCESS_TIMEOUT)%'
            check_on_boot: true
            boot_failure: warning
            export:
                # Overridden per request from the Word basename + " [converted].pdf"
                filename: document [converted].pdf
