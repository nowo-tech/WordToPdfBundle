version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "composer"
    directory: "/"
    versioning-strategy: widen
    schedule:
      interval: "weekly"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"
          - "phpstan-*/*"
          - "rector/rector"
    commit-message:
      prefix: "composer"

  # pip dependencies of the Python tests (REQ-GH-002, REQ-TEST-004)
  - package-ecosystem: "pip"
    directory: "/tests_python"
    schedule:
      interval: "weekly"
    groups:
      pip-tests-python:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
